name: Cập nhật giá vàng

on:
  schedule:
    - cron: "*/15 * * * *"   # mỗi 15 phút (giờ UTC); GitHub có thể chạy trễ vài phút
  workflow_dispatch:          # cho phép bấm "Run workflow" thủ công

permissions:
  contents: write

concurrency:
  group: gold-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lấy giá vàng
        run: node scripts/fetch-prices.mjs
      - name: Commit nếu có thay đổi
        run: |
          git config user.name "gold-price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices
          if git diff --cached --quiet; then
            echo "Giá không đổi, bỏ qua."
          else
            git commit -m "Cập nhật giá vàng $(TZ=Asia/Ho_Chi_Minh date '+%d/%m/%Y %H:%M')"
            git push
          fi
